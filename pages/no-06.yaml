# Noah - Spread 6: Midpoint

id: no-06
spread: 6
node_type: solo
beat: "Midpoint: new insight / pattern"
hook: A pattern or clue emerges, suggesting a new direction based on observation.
payoff: New approach is tried based on the insight from previous spread.

description: Noah discovers that the floating stories aren't fiction exercises but real children's real courage moments, waiting to be honored with truth.

scenes:
  - page: left
    page_number: 15
    focus: Studying the pattern more carefully
    visual: |
      Noah sits beneath the glowing story-fragments, studying them carefully. He takes notes, analyzing
      each one. A girl who tried and failed. A boy who felt invisible. Someone afraid to speak up. Not
      clever plots. Real moments. Real feelings. His expression shifts from analytical to thoughtful.
      The owl watches from above. Books hover nearby, chiming softly. The atmosphere is quiet discovery.
      Text in Times New Roman 20pt in white space at bottom.
    text: |
      Noah found himself alone again, studying the floating stories. A girl who tried out for the team and didn't make it. A boy whose best friend moved away. Someone too scared to raise their hand. His clever endings wouldn't work here. These weren't fiction exercises. They were real.

  - page: right
    page_number: 16
    focus: The breakthrough realization
    visual: |
      Noah stands, eyes wide with understanding. Golden threads connect the story fragments above him,
      revealing their true nature. Each fragment pulses with authentic emotion. Real courage. Real fear.
      Real hope. The Heart Crystal hums softly in the distance. Noah's notebook falls to his side, all
      his formulas suddenly irrelevant. His expression shows awed realization. The atmosphere celebrates
      profound understanding.
    text: |
      "These are real kids who need stories that demonstrate real courage." A girl who spoke up anyway. A boy who kept trying. Someone who chose kindness when it was hard. The threads connected. Not stories to solve. Stories to honor. The Heart Crystal hummed louder. 
