# Noah - Spread 1: Ordinary World

id: no-01
spread: 1
node_type: solo
beat: "Ordinary world + desire hint"
hook: Something new or unusual appears, creating curiosity about what it is.
payoff: The discovery is fully revealed, establishing the story goal.

description: Noah writes clever, technically perfect stories for his blog when golden threads appear, forming story fragments that need completion.

scenes:
  - page: left
    page_number: 5
    focus: Character in their ordinary world
    visual: |
      Noah's bedroom. Adventure books line the shelves. Climbing gear hangs on hooks. Basketball
      trophies on a shelf. Noah (12 years old, sandy blond voluminous hair, medium build, blue
      hoodie, tan sport pants, white sneakers) sits at his desk, laptop open showing his writing
      blog with comments: "So clever!" "Love the plot twist!" "You're such a good writer!" He
      grins at the screen. His notebook shows story outlines with intricate plot structures, character
      charts, and twist reveals. A stack of finished stories sits beside him. His ukulele leans
      against the nightstand. The atmosphere is confident and successful. Text in Times New Roman
      20pt in white space at bottom.
    text: |
      Noah scrolled through the comments on his latest story. "That plot twist was genius!" "I never saw it coming!" He grinned. His stories were always clever. Surprising. Well-constructed. He loved planning every detail, engineering the perfect reveal.

  - page: right
    page_number: 6
    focus: First hint of something different
    visual: |
      Golden threads suddenly weave through Noah's room, floating in the air. Instead of forming
      puzzles, they weave story scenes—a girl crying, a hero running, an ending that stops mid-sentence.
      The threads form glowing text: "THE LIBRARY OF KATHAÉL NEEDS STORYTELLERS." More threads create
      a shimmering doorway of golden light. Noah stands, eyes wide. His writer-brain already analyzing
      the narrative structure. The atmosphere is mysterious and inviting.
    text: |
      Suddenly, golden threads swirled through his room. Weaving story fragments in the air. A beginning. A middle. No ending. The threads spelled: "THE LIBRARY OF KATHAÉL NEEDS STORYTELLERS." A doorway formed, glowing gold. Noah's heart raced. Stories that needed finishing? This was his specialty. He grabbed his notebook and pen.
