# Noah - Spread 2: Inciting Incident

id: no-02
spread: 2
node_type: solo
beat: "Inciting incident"
hook: The path forward runs out or becomes unclear, raising uncertainty.
payoff: The wider world opens up with multiple options and first plan emerges.

description: Noah arrives in the Library of Kathaél and discovers unfinished stories floating in the air, each needing an ending written from the heart, not just clever plotting.

scenes:
  - page: left
    page_number: 7
    focus: Discovery of the problem
    visual: |
      Noah lands in a magnificent forest library. Ancient trees with glowing books on branches. Floating
      scrolls chime like wind chimes. Books flutter playfully past. In the center rises a massive crystalline
      structure. Unfinished stories float in the air like golden holograms—a brave knight mid-quest, a lonely
      child reaching out, an adventure stopping mid-sentence. Each story glows but flickers, incomplete.
      An owl swoops down, landing on a branch. The whole library hums with anticipation. The atmosphere
      is wonder meeting need. Text in Times New Roman 20pt in white space at bottom.
    text: |
      Noah landed in a forest library. An owl swooped down. "Welcome, Storyteller! You answered the call!" Stories hung in the air. Unfinished. Flickering. A knight frozen mid-quest. A child mid-cry. Adventures with no endings. Noah's eyes went wide. This was incredible.

  - page: right
    page_number: 8
    focus: Decision to act
    visual: |
      Noah approaches the first story-fragment. It shows a brave knight facing a dragon but stops there,
      waiting for an ending. Behind the story, the massive Heart Crystal rises, currently dim and inactive.
      The owl explains from a nearby branch. Noah opens his notebook, pen ready, his analytical brain already
      working on the perfect plot twist. He touches the story and it glows brighter. His expression shows
      excitement and confidence. This is exactly the kind of challenge he loves. The atmosphere celebrates
      discovery and adventure beginning.
    text: |
      The owl spoke: "The Heart Crystal holds every story of courage from every child who's ever been brave. These stories flow to Earth, giving other children strength. But the Crystal is cracking. Stories are stuck, unfinished. They need endings." Noah grinned. "I can write endings!" The owl's eyes gleamed. "Not just any endings. True ones. From the heart." Noah nodded. 
