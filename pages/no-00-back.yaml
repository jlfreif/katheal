scenes:
  - page: left
    page_number: 2
    focus: Back cover
    visual: |
      Back cover design with soft watercolor background in mist blues and warm creams. Golden
      threads create an elegant border around the edges, weaving into subtle puzzle patterns
      and constellation symbols. A small facet of the Heart Crystal glows softly in the upper
      corner, casting prismatic light. The golden threads form decorative frames for the text
      areas. At the bottom, tiny silhouettes of six children (representing all the characters)
      stand together, connected by shimmering golden threads. The overall atmosphere is warm,
      enchanted, and inviting, with delicate ink linework adding detail to the magical elements.
      Space in the center is left clear for text placement.
    text: |
      When golden threads spell out "THE LIBRARY OF KATHAÉL NEEDS STORYTELLERS," writer Noah
      can't resist. But in this enchanted realm, the Heart Crystal is cracking and courage
      stories are fading. To save them, Noah must learn that the best stories aren't the
      cleverest—they're the truest. The ones written from the heart, even when it's scary.

      Part of the Kathaél Storybook Series
      Ages 8-12

