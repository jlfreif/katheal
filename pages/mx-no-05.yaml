scenes:
  - page: left
    page_number: 13
    focus: Entering unfamiliar territory
    visual: |
      A clearing filled with floating story fragments and challenge patterns. Unfinished tales hover
      like ghosts. Max stands at one edge, holding a notebook full of analytical diagrams. Noah enters
      from the opposite side, his notebook covered in story formulas and crossed-out attempts. They
      spot each other across the clearing. Both wear expressions of surprise. The atmosphere is
      frustrated determination meeting surprise.
    text: |
      Noah followed the threads to a clearing full of floating stories. Fragments everywhere. Incomplete. "Max?" Noah said with surprise. "Is that you?" Max's eyes went wide. "Noah! What are you doing here?" A crow smiled from above. "Ah, the analytical cousins. Perfect."

  - page: right
    page_number: 14
    focus: Encountering misleading help
    visual: |
      Max and Noah stand face to face, both holding notebooks covered in analytical notes and crossed-out
      attempts. The crow gestures wildly at the brightest glowing story fragment. "Use formulas!" it caws.
      "Copy what's popular! Skip the hard parts!" Max and Noah exchange uncertain glances. The crow swoops
      down, grabs the bright piece, and yanks it with a shortcut formula. The entire pattern collapses.
      Fragments scatter. Grey dust. The atmosphere shifts from temptation to realization.
    text: |
      "Use formulas!" the crow said. "Copy what works!" Max frowned. "That seems too simple?" Noah hesitated. They stared at their pages of overthinking. Max with obstacle formulas. Noah with story templates. "We keep trying to find the perfect system," Noah said slowly. "But maybe we just need to try things. Learn as we go." Something deeper in the forest pulsed. The real challenges waited ahead.
