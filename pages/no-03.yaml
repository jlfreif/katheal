# Noah - Spread 3: First Attempt

id: no-03
spread: 3
node_type: solo
beat: "Attempt #1 (simple/obvious)"
hook: Simple solutions fail, prompting the question of who might have better answers.
payoff: A wise helper appears who offers new perspective or guidance.

description: Noah writes a clever, technically perfect ending for a story, but it turns grey and crumbles because it lacks emotional truth.

scenes:
  - page: left
    page_number: 9
    focus: Trying the obvious solution
    visual: |
      Noah sits beneath a glowing story-fragment showing a brave knight facing a dragon. He writes in
      his notebook, crafting a clever conclusion—the knight solves a riddle, defeats the dragon through
      wit, saves the kingdom. As he writes, golden words flow from his pen into the air, completing the
      story with technical precision. The knight moves, the dragon roars, the kingdom appears. The story
      glows brighter. Noah grins, confident. The owl watches from above. The atmosphere celebrates success
      through skill. Text in Times New Roman 20pt in white space at bottom.
    text: |
      Noah opened his notebook. The knight's story needed an ending. He analyzed the structure. Clear hero's journey. Needed a clever resolution. He wrote quickly: the knight solves an ancient riddle, outwits the dragon, saves the kingdom. Perfect! Golden words flowed from his pen. The story glowed brighter. "See?" Noah said, grinning. "Easy."

  - page: right
    page_number: 10
    focus: Realizing it doesn't work
    visual: |
      Noah watches proudly as his completed story begins to fade—turning grey and brittle like old paper.
      The knight freezes mid-victory. The dragon dissolves to ash. The kingdom crumbles. Noah's expression
      shifts from pride to confusion. Around the library, other unfinished stories pulse with need—stories
      about real fear, real loneliness, real failure. Stories that need emotional truth, not clever plotting.
      The owl speaks gently from its perch. Noah stares at his technically perfect but emotionally hollow
      ending as it falls apart. The atmosphere is gentle correction, not harsh judgment.
    text: |
      But the story turned grey. Crumbling. "Wait. No!" Noah reached for it. Too late. It dissolved to dust. The owl tilted its head. "Technically perfect. But the Library doesn't need clever stories. It needs true ones. Written from the heart, not just the mind." Noah looked around. So many unfinished stories. All waiting for something he didn't know how to give.
