    visual: |
      Front cover illustration. Noah (12 years old, sandy blond voluminous hair, medium build,
      blue hoodie, tan sport pants, white sneakers) stands at the center, holding a glowing
      pen in one hand with his notebook open in the other. Golden threads swirl from the pen,
      weaving into story scenes floating in the air around him—a brave knight, a lonely child,
      an unfinished adventure. His expression is excited and determined, eyes wide with creative
      wonder. Behind him, the Library of Kathaél rises with shelves of glowing books growing on
      ancient trees, and the massive Heart Crystal visible in the background, its facets refracting
      golden light. More golden threads flow from the Crystal toward Noah, forming word fragments
      and story beginnings in the air. The atmosphere is luminous and adventurous, with watercolor
      washes of honey golds, warm creams, and mist blues. Delicate ink linework defines the threads
      and forest library details. The scene captures Noah's writer's heart meeting magical wonder.

      At the top of the cover, in elegant script: "The Library of Kathaél"
      Below that, in bold lettering: "Noah's Journey"
