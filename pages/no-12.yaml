# Noah - Spread 12: Resolution

id: no-12
spread: 12
node_type: solo
beat: "Resolution: return and transformation"
hook: Final moment of reflection showing ongoing connection or meaning.
payoff: Landing complete - ordinary world echoes opening but character has grown.

description: Noah returns home transformed by the adventure, immediately applies what he learned about writing true stories instead of clever ones.

scenes:
  - page: left
    page_number: 27
    focus: Returning home with what was gained
    visual: |
      Golden threads gently deposit Noah back in his bedroom. He lands in his desk chair, slightly dizzy.
      Everything looks the same. Books on shelves. Climbing gear. Basketball trophies. His laptop still open
      to his writing blog showing the clever stories and comments: "Genius plot!" "Great twist!" The praise
      feels hollow now. He closes the blog window. His notebook lies open to an old story outline. He looks
      at it differently. The atmosphere is ordinary world seen anew. Text in Times New Roman 20pt in white
      space at bottom.
    text: |
      Noah returned to his room. Golden threads set Noah down in his chair. He sees the prior praise for his blog. He closed the blog and opened his notebook.

  - page: right
    page_number: 28
    focus: Ordinary world transformed by journey's lessons
    visual: |
      Noah writes in his notebook, starting something new. Not a clever mystery with a twist. A true story
      about wanting something you can't have. About feeling invisible at a family gathering. About his
      voluminous hair that everyone compliments but sometimes makes him feel like that's all they see.
      Simple, honest words. Through his window, a single golden thread glimmers briefly before fading.
      His ukulele leans nearby. The atmosphere celebrates courage over cleverness.
    text: |
      Noah started writing. Not about plot twists or clever heroes. About real things. About adventures in foreign countries. About friendship. A golden thread glimmered outside his window. Noah smiled. The best stories are the ones you're brave enough to write.
